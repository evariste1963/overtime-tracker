<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000" id="themeMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Overtime Tracker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #000;
  --card: #1a1a1a;
  --input-bg: #222;
  --total-bg: #2a2a2a;
  --finish-bg: #333;
  --border: #333;
  --text: var(--electric-teal);
  --text-secondary: var(--electric-teal);
  --text-label: var(--electric-teal);
  --btn-text: #777;
  --accent: #888;
  --toggle-bg: #1a1a1a;
  --toggle-border: #333;
  --accent-blue: #1e3a8a;
  --electric-teal: #3b82f6;
  --text-glow: 0 0 1px var(--accent-blue), 0 0 1px var(--electric-teal);
}

.light {
  --bg: #fff;
  --card: #f0f0f0;
  --input-bg: #e8e8e8;
  --total-bg: #e0e0e0;
  --finish-bg: #d4d4d4;
  --border: #ccc;
  --text: #111;
  --text-secondary: #888;
  --text-label: #555;
  --accent: #666;
  --toggle-bg: #e0e0e0;
  --toggle-border: #ccc;
  --accent-blue: #2563eb;
}

.light body,
.light h1,
.light .day-name,
.light .sum-row,
.light .finish-row,
.light #combinedRow,
.light .footer-note {
  text-shadow: none;
}
.light .btn-share,
.light .btn-reset {
  color: #fff;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  text-shadow: var(--text-glow);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  padding: 16px;
  transition: background 0.3s, color 0.3s;
}
h1, .day-name, #combinedRow {
  text-shadow: var(--text-glow);
}
.sum-row, .finish-row {
  text-shadow: none;
}
.container {
  width: 100%;
  max-width: 420px;
  padding-top: max(48px, env(safe-area-inset-top));
}
.header-row {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}
h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--electric-teal);
}
.theme-toggle {
  position: absolute;
  right: 0;
  background: var(--toggle-bg);
  border: 1px solid var(--toggle-border);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 16px;
  cursor: pointer;
  color: var(--text);
  transition: background 0.5s;
  line-height: 1;
}
.theme-toggle:active { opacity: 0.7; }
.week-label {
  text-align: center;
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 12px;
}
.day-row {
  display: flex;
  align-items: center;
  background: var(--card);
  border-radius: 12px;
  padding: 10px 18px;
  margin-bottom: 8px;
  transition: background 0.5s;
}
.day-name {
  width: 130px;
  font-weight: 600;
  font-size: 15px;
  color: var(--text-label);
}
.day-input-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
}
.day-input-wrap input[type=number] {
  width: 80px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 16px;
  text-align: center;
  outline: none;
  transition: border-color 0.2s, background 0.3s, color 0.3s;
}
.day-input-wrap input[type=number]:focus {
  border-color: var(--accent);
}
.no-lunch-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: #888;
  cursor: pointer;
  margin-right: 6px;
  white-space: nowrap;
  text-shadow: none;
}
.no-lunch-cb {
  width: 20px;
  height: 20px;
  accent-color: var(--accent);
  cursor: pointer;
}
.no-lunch-display {
  width: 80px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 16px;
  text-align: center;
  outline: none;
  opacity: 0.5;
  transition: background 0.3s, color 0.3s;
}
.no-lunch-cb:checked ~ span {
  color: var(--electric-teal);
}
.day-input-wrap input[type=number]::-webkit-inner-spin-button,
.day-input-wrap input[type=number]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.day-input-wrap input[type=number] {
  -moz-appearance: textfield;
}
.day-input-wrap input[type=time] {
  width: 100px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 16px;
  text-align: center;
  outline: none;
  transition: border-color 0.2s, background 0.3s, color 0.3s;
}
.day-input-wrap input[type=time]:focus {
  border-color: var(--accent);
}
.hours-unit {
  color: var(--text-secondary);
  font-size: 13px;
  width: 24px;
}
.sum-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--total-bg);
  border-radius: 12px;
  padding: 12px 18px;
  margin-top: 8px;
  font-weight: 700;
  font-size: 18px;
  transition: background 0.3s;
}
.sum-label { font-size: 15px; }
.finish-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--finish-bg);
  border-radius: 12px;
  padding: 10px 18px;
  margin-top: 8px;
  font-weight: 600;
  font-size: 16px;
  transition: background 0.3s;
}
.finish-label { font-size: 16px; }
.finish-value { font-size: 20px; }
.banked-positive { color: var(--electric-teal); }
.actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.actions button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, background 0.3s, color 0.3s;
}
.btn-reset {
  background: var(--accent-blue);
  color: var(--btn-text);
}
.btn-share {
  background: var(--accent-blue);
  color: var(--btn-text);
}
.footer-note {
  text-align: center;
  color: var(--electric-teal);
  font-size: 16px;
  font-style: italic;
  margin-top: 24px;
  opacity: 0.6;
  text-shadow: 0 0 4px var(--electric-teal), 0 0 12px var(--electric-teal), 0 0 24px var(--accent-blue), 0 0 56px var(--accent-blue), 0 0 80px rgba(37,99,235,0.3);
}
#finishRow { margin-top: 10px; }
#finishRow .day-name { width: auto; flex: 1; }
#combinedRow { gap: 12px; justify-content: space-between; }
#combinedRow > div { display: flex; align-items: center; gap: 6px; }
#combinedRow span { font-size: 15px; font-weight: 600; color: var(--text-label); }
#proposedFinish {
  width: 100px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 16px;
  text-align: center;
  outline: none;
  transition: border-color 0.2s, background 0.3s, color 0.3s;
}
#proposedFinish:focus { border-color: var(--accent); }
.banked-week { color: var(--text-secondary); }
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  width: 100%;
  max-width: 380px;
}
.modal-card h2 {
  font-size: 18px;
  margin-bottom: 16px;
  color: var(--electric-teal);
}
.modal-field {
  margin-bottom: 14px;
}
.modal-field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-label);
  margin-bottom: 4px;
}
.modal-field input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 15px;
  outline: none;
}
.modal-field input:focus {
  border-color: var(--accent);
}
.modal-field small {
  display: block;
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
  opacity: 0.6;
}
.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.modal-btn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn-save {
  background: var(--accent-blue);
  color: #fff;
}
.btn-cancel {
  background: var(--finish-bg);
  color: var(--text);
}
.btn-defaults {
  background: var(--accent-blue);
  color: var(--btn-text);
}
</style>
</head>
<body>
<div class="container">
  <div class="header-row">
    <h1>Overtime Tracker</h1>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀</button>
  </div>
  <div class="week-label" id="weekLabel"></div>

  <div id="daysContainer"></div>

  <div class="sum-row">
    <span class="sum-label">Total</span>
    <span id="totalHours">0.00 h</span>
  </div>

  <div id="finishRow" class="day-row">
    <div class="day-name">Week Finish</div>
    <div class="day-input-wrap">
      <input type="time" id="fridayFinish">
    </div>
  </div>

  <div id="combinedRow" class="day-row">
    <div>
      <span>Earliest</span>
      <span id="earliestFinish">--:--</span>
    </div>
    <div>
      <span>Actual</span>
      <input type="time" id="proposedFinish">
    </div>
  </div>

  <div id="bankedRow" class="finish-row">
    <span class="finish-label">Banked <span class="banked-week">(WK <span id="bankedWeekNum"></span>)</span></span>
    <span class="finish-value" id="bankedValue">--:--</span>
  </div>

  <div class="actions">
    <button class="btn-defaults" onclick="openEmailDefaultsModal()">set defaults</button>
    <button class="btn-share" onclick="shareOvertime()">send e-mail</button>
    <button class="btn-reset" onclick="resetAll()">reset all</button>
  </div>
  <div class="footer-note">developed by this.me</div>
</div>

<div id="defaultsModal" class="modal-overlay" onclick="closeEmailDefaultsModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <h2>Email Defaults</h2>
    <div class="modal-field">
      <label>Default To</label>
      <input type="text" id="defaultToInput" placeholder="email@example.com">
      <small>semi-colon separated</small>
    </div>
    <div class="modal-field">
      <label>Default Cc</label>
      <input type="text" id="defaultCcInput" placeholder="email@example.com">
      <small>semi-colon separated</small>
    </div>
    <div class="modal-field">
      <label>Recipient Name</label>
      <input type="text" id="recipientNameInput" placeholder="e.g. Annette">
    </div>
    <div class="modal-field">
      <label>Sender Name</label>
      <input type="text" id="senderNameInput" placeholder="e.g. Royston">
    </div>
    <div class="modal-actions">
      <button class="btn-save modal-btn" onclick="saveEmailDefaultsFromForm()">Save</button>
      <button class="btn-cancel modal-btn" onclick="closeEmailDefaultsModal()">Cancel</button>
    </div>
  </div>
</div>
<script src="overtime-email.js"></script>
<script>
const DAYS = ['Banked', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
const STORAGE_KEY = 'ot_tracker';
const THEME_KEY = 'ot_theme';

function getWeekId(now = new Date()) {
  const start = new Date(now);
  start.setHours(0,0,0,0);
  const day = now.getDay() || 7;
  start.setDate(now.getDate() - day + 1);
  const y = start.getFullYear();
  const m = String(start.getMonth() + 1).padStart(2, '0');
  const d = String(start.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function getWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function getPreviousWeekNumber() {
  const prev = new Date();
  prev.setDate(prev.getDate() - 7);
  return getWeekNumber(prev);
}

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getDefaultData() {
  const weekId = getWeekId();
  const hours = {};
  DAYS.forEach(d => hours[d] = '');
  return { weekId, hours, fridayFinish: '15:00', proposedFinish: '15:00', noLunch: false };
}

function timeToMinutes(t) {
  if (!t || !t.includes(':')) return NaN;
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function minutesToTime(mins) {
  const h = Math.floor(mins / 60);
  const m = Math.round(mins % 60);
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function updateEarliestFinish() {
  const data = loadData();
  if (!data) return;
  const total = getTotalMinutes(data);
  const finishStr = data.fridayFinish || '';
  const finishMins = timeToMinutes(finishStr);
  const el = document.getElementById('earliestFinish');
  if (isNaN(finishMins)) {
    el.textContent = '--:--';
  } else {
    el.textContent = minutesToTime(finishMins - total);
  }
  updateBanked();
}

function updateBanked() {
  const data = loadData();
  if (!data) return;
  const earliest = document.getElementById('earliestFinish');
  const pf = document.getElementById('proposedFinish');
  const bankedEl = document.getElementById('bankedValue');
  if (!earliest || !pf || !bankedEl) return;

  const eText = earliest.textContent;
  const proposed = pf.value;

  if (eText === '--:--' || !proposed) {
    bankedEl.textContent = '--:--';
    bankedEl.classList.remove('banked-positive');
    return;
  }

  const eMins = timeToMinutes(eText);
  const pMins = timeToMinutes(proposed);

  if (isNaN(eMins) || isNaN(pMins)) {
    bankedEl.textContent = '--:--';
    bankedEl.classList.remove('banked-positive');
    return;
  }

  const diff = (pMins - eMins) / 60;
  bankedEl.textContent = (diff >= 0 ? '+' : '') + diff.toFixed(2) + ' h';
  bankedEl.classList.toggle('banked-positive', diff >= 0);
}

function getTotalMinutes(data) {
  let total = 0;
  DAYS.forEach(day => {
    const v = parseFloat(data.hours[day]);
    if (!isNaN(v)) total += v;
  });
  if (data.noLunch) total += 0.5;
  return total * 60;
}

function computeBottomBanked(data) {
  if (!data || !data.fridayFinish || !data.proposedFinish) return NaN;
  const totalMins = getTotalMinutes(data);
  const finishMins = timeToMinutes(data.fridayFinish);
  const proposedMins = timeToMinutes(data.proposedFinish);
  if (isNaN(finishMins) || isNaN(proposedMins)) return NaN;
  return (proposedMins - (finishMins - totalMins)) / 60;
}

function toggleTheme() {
  const el = document.documentElement;
  el.classList.toggle('light');
  const isLight = el.classList.contains('light');
  localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark');
  document.getElementById('themeToggle').textContent = isLight ? '🌙' : '☀';
  document.getElementById('themeMeta').content = isLight ? '#ffffff' : '#000000';
}

function applyTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  const el = document.documentElement;
  if (saved === 'light') {
    el.classList.add('light');
    document.getElementById('themeToggle').textContent = '🌙';
    document.getElementById('themeMeta').content = '#ffffff';
  } else {
    el.classList.remove('light');
    document.getElementById('themeToggle').textContent = '☀';
    document.getElementById('themeMeta').content = '#000000';
  }
}

function render() {
  const now = new Date();
  let data = loadData();
  const currentWeek = getWeekId(now);

  if (!data || data.weekId !== currentWeek) {
    const oldData = data;
    data = getDefaultData();
    const bottom = computeBottomBanked(oldData);
    if (!isNaN(bottom) && bottom !== 0) {
      data.hours.Banked = bottom.toFixed(2);
    }
    saveData(data);
  }

  const wn = getWeekNumber(now);
  document.getElementById('weekLabel').textContent =
    `Week ${wn}`;

  const container = document.getElementById('daysContainer');
  container.innerHTML = '';

  DAYS.forEach(day => {
    const row = document.createElement('div');
    row.className = 'day-row';

    const name = document.createElement('div');
    name.className = 'day-name';
    if (day === 'Banked') {
      name.innerHTML = 'Banked <span class="banked-week">(WK ' + getPreviousWeekNumber() + ')</span>';
    } else {
      name.textContent = day;
    }
    row.appendChild(name);

    const wrap = document.createElement('div');
    wrap.className = 'day-input-wrap';

    if (day === 'Fri') {
      const cbLabel = document.createElement('label');
      cbLabel.className = 'no-lunch-label';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'no-lunch-cb';
      cb.checked = !!data.noLunch;
      const display = document.createElement('input');
      display.type = 'text';
      display.className = 'no-lunch-display';
      display.readOnly = true;
      display.value = data.noLunch ? '0.5' : '';
      cb.addEventListener('change', () => {
        data.noLunch = cb.checked;
        display.value = data.noLunch ? '0.5' : '';
        saveData(data);
        updateTotal();
        updateEarliestFinish();
      });
      cbLabel.appendChild(cb);
      const labelSpan = document.createElement('span');
      labelSpan.textContent = 'No-lunch';
      cbLabel.appendChild(labelSpan);
      wrap.appendChild(cbLabel);
      wrap.appendChild(display);
    }

    const input = document.createElement('input');
    input.type = 'number';
    input.step = '0.25';
    input.min = '0.00';
    input.placeholder = '0.00';
    const h = data.hours[day];
    input.value = h !== undefined && h !== '' ? parseFloat(h).toFixed(2) : '';
    input.addEventListener('input', () => {
      let v = input.value;
      if (v.startsWith('.')) v = '0' + v;
      if (v !== input.value) input.value = v;
      data.hours[day] = input.value;
      saveData(data);
      updateTotal();
      updateEarliestFinish();
    });
    input.addEventListener('blur', () => {
      if (input.value !== '') {
        const f = parseFloat(input.value);
        if (!isNaN(f)) {
          input.value = f.toFixed(2);
          data.hours[day] = input.value;
          saveData(data);
        }
      }
    });

    const unit = document.createElement('span');
    unit.className = 'hours-unit';
    unit.textContent = 'h';

    wrap.appendChild(input);
    wrap.appendChild(unit);
    row.appendChild(wrap);
    container.appendChild(row);
  });

  const ff = document.getElementById('fridayFinish');
  ff.value = data.fridayFinish || '15:00';
  ff.addEventListener('change', () => {
    data.fridayFinish = ff.value;
    saveData(data);
    updateEarliestFinish();
  });

  const pf = document.getElementById('proposedFinish');
  pf.value = data.proposedFinish || '15:00';
  document.getElementById('bankedWeekNum').textContent = wn;
  pf.addEventListener('change', () => {
    data.proposedFinish = pf.value;
    saveData(data);
    updateBanked();
  });

  updateTotal();
  updateEarliestFinish();
}

function updateTotal() {
  const data = loadData();
  if (!data) return;
  document.getElementById('totalHours').textContent = (getTotalMinutes(data) / 60).toFixed(2) + ' h';
}

function resetAll() {
  if (!confirm('Clear all fields except Banked?')) return;
  const data = loadData();
  if (!data) return;
  const banked = data.hours.Banked;
  DAYS.forEach(d => data.hours[d] = '');
  data.hours.Banked = banked;
  data.noLunch = false;
  data.fridayFinish = '15:00';
  data.proposedFinish = '15:00';
  saveData(data);
  render();
}

applyTheme();
render();

if ('serviceWorker' in navigator) {
  try {
    navigator.serviceWorker.register('/sw.js');
  } catch (_) {}
}
</script>
</body>
</html>
